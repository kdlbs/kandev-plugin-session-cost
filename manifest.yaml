id: "kandev-session-cost"
api_version: 1
version: "0.4.0"
display_name: "Session Cost"
description: "Adds a cost icon to the chat bar with pinnable spend details and explicit refresh — resolved from the agent transcript by the tokscale CLI."
author: "kandev"
repo_url: "https://github.com/kdlbs/kandev-plugin-session-cost"
categories: ["analytics"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Read-only access to kandev sessions so the backend can map the composer's
# kandev session id to its agent/ACP transcript id (Host data API). The UI
# only ever sends kandev ids; the transcript join happens server-side.
capabilities:
  api_read: ["sessions", "tasks", "session_usage"]
  api_write: ["session_usage"]
  state: true

actions:
  - key: "session-usage"
    scope: "task"
    access: "authenticated"
    max_body_bytes: 4096
  - key: "historical-import-start"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024
  - key: "historical-import-status"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024
  - key: "historical-import-cancel"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024

webhooks:
  - key: "session-cost"
    description: "Cost of the active chat session as JSON (GET; ?task_id=&active=)"
    method: "GET"

ui:
  bundle: "/ui/bundle.js"

# Operator settings (Settings > Plugins > Session Cost). Read through the Host
# GetConfig RPC on every webhook call; kandev restarts the plugin whenever the
# operator saves, so changes take effect immediately.
config_schema:
  type: object
  properties:
    command:
      type: string
      title: "tokscale command"
      description: >-
        Command to run the tokscale CLI, e.g. "/usr/local/bin/tokscale" or
        "npx -y tokscale@4.15.1". Empty = auto-detect ("tokscale" on PATH,
        otherwise a pinned npx fallback).
    warn_threshold:
      type: number
      title: "Warn threshold (USD)"
      description: "Session cost at or above this turns the amount amber. Default 1."
      default: 1
    high_threshold:
      type: number
      title: "High threshold (USD)"
      description: "Session cost at or above this turns the amount red. Default 10."
      default: 10
    collect_statistics:
      type: boolean
      title: "Collect statistics"
      description: "Periodically save token and cost measurements for the statistics page. Default off."
      default: false
    collection_interval_minutes:
      type: integer
      minimum: 1
      title: "Collection interval (minutes)"
      description: "Minutes between background collection passes. Minimum 1; default 5."
      default: 5
