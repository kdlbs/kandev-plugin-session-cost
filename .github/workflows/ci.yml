name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tidy, format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # The local SDK replacement in go.mod expects these checkouts to be
      # siblings: plugin/../kandev/apps/backend.
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out kandev SDK
        uses: actions/checkout@v4
        with:
          repository: kdlbs/kandev
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test
        working-directory: plugin
        run: make test
