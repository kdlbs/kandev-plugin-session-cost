name: release

# Run manually from GitHub Actions on main to calculate a version, commit the
# release metadata and changelog, tag that commit, then build and publish it.
# Existing v* tag pushes skip preparation and only build and publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Calculate the release version without committing, tagging, or publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release commit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$CURRENT_REF" = "refs/heads/main" || {
            echo "Run releases from main, not $CURRENT_REF." >&2
            exit 1
          }

      - name: Check out main and release tags
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Compute next release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -nE 's/^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' manifest.yaml)"
          MAKE_VERSION="$(sed -nE 's/^VERSION := ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Makefile)"
          test -n "$CURRENT_VERSION" || { echo "manifest.yaml has no SemVer version." >&2; exit 1; }
          test "$CURRENT_VERSION" = "$MAKE_VERSION" || {
            echo "manifest.yaml ($CURRENT_VERSION) and Makefile ($MAKE_VERSION) disagree." >&2
            exit 1
          }

          LATEST_TAG="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          BASELINE="$(CURRENT_VERSION="$CURRENT_VERSION" LATEST_TAG="$LATEST_TAG" python3 - <<'PY'
          import os
          current = tuple(map(int, os.environ["CURRENT_VERSION"].split(".")))
          latest = os.environ["LATEST_TAG"].removeprefix("v")
          tagged = tuple(map(int, latest.split("."))) if latest else (0, 0, 0)
          print(".".join(map(str, max(current, tagged))))
          PY
          )"
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASELINE"
          case "$BUMP" in
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          TAG="v$NEXT"

          ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || {
            echo "Tag already exists locally: $TAG" >&2
            exit 1
          }
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || {
            echo "Tag already exists on origin: $TAG" >&2
            exit 1
          }

          echo "Current version: $CURRENT_VERSION"
          echo "Latest release tag: ${LATEST_TAG:-none}"
          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        run: echo "Would commit, tag, and publish ${{ steps.version.outputs.tag }}."

      - name: Update release metadata and changelog
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: \"[0-9]+\.[0-9]+\.[0-9]+\"$/version: \"$VERSION\"/" manifest.yaml
          sed -i -E "s/^VERSION := [0-9]+\.[0-9]+\.[0-9]+$/VERSION := $VERSION/" Makefile
          sed -i -E "s/kandev-session-cost-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz/kandev-session-cost-$VERSION.tar.gz/" README.md

          RANGE="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"
          CHANGES="$(git log --no-merges --format='- %s (%h)' "$RANGE")"
          test -n "$CHANGES" || CHANGES="- Initial release"
          {
            echo "# Changelog"
            echo
            printf '## [%s] - %s\n\n' "$VERSION" "$(date -u +%F)"
            echo "### Changed"
            echo
            printf '%s\n' "$CHANGES"
            echo
            test ! -f CHANGELOG.md || tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Commit and tag release metadata
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml Makefile README.md CHANGELOG.md
          git commit -m "release: $VERSION"
          git push origin HEAD:main
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

  publish:
    name: Build and publish release
    needs: prepare
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.prepare.result == 'success'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin
          ref: ${{ github.event_name == 'push' && github.ref || needs.prepare.outputs.tag }}

      - name: Checkout kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          path: kandev
          sparse-checkout: apps/backend

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Verify
        working-directory: plugin
        run: |
          test -z "$(gofmt -l ./server)" || { echo "gofmt needed:"; gofmt -l ./server; exit 1; }
          go vet ./server/...
          make test

      - name: Package all platforms
        working-directory: plugin
        run: make package

      - name: Extract checksums
        working-directory: plugin
        run: tar -xzf kandev-session-cost-*.tar.gz checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
          files: |
            plugin/kandev-session-cost-*.tar.gz
            plugin/checksums.txt
          generate_release_notes: true
